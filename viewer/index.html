<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="icon" href="data:," />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AutoMarkBloom Viewer</title>
<style>
  :root { --bg: #f6f1ec; --panel: rgba(255,255,255,0.86); --text: #2b2228; --muted: #7a6b72; --accent: #b2456c; --line: #e4d8dc; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #17131a; --panel: rgba(34,28,36,0.88); --text: #f1e8ec; --muted: #a8979f; --accent: #ef8fb0; --line: #3a2f3c; } }
  :root[data-theme="dark"] { --bg: #17131a; --panel: rgba(34,28,36,0.88); --text: #f1e8ec; --muted: #a8979f; --accent: #ef8fb0; --line: #3a2f3c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; height: 100dvh; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #panel { position: fixed; top: 12px; left: 12px; width: min(300px, calc(100vw - 24px)); background: var(--panel); backdrop-filter: blur(8px);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 10px; }
  h1 { font-size: 15px; margin: 0; letter-spacing: .02em; }
  .row { display: flex; gap: 6px; align-items: center; }
  .row > * { flex: 1; }
  label { color: var(--muted); font-size: 12px; }
  input[type=number], button, select { font: inherit; color: var(--text); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: white; border-color: var(--accent); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  #info { color: var(--muted); font-size: 12px; }
  #err { color: #c0392b; font-size: 12px; white-space: pre-wrap; }
  details > summary { cursor: pointer; color: var(--muted); font-size: 12px; list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before { content: "▸ "; }
  details[open] > summary::before { content: "▾ "; }
  details[open] > .more { display: grid; gap: 10px; margin-top: 10px; }
  /* Phones: controls become a bar on top and the flower gets the rest of the screen. */
  @media (max-width: 700px) {
    #app { position: relative; inset: auto; flex: 1; min-height: 0; }
    #panel { max-height: 55dvh; overflow-y: auto; position: static; order: -1; width: auto; margin: 0; border-radius: 0; border-width: 0 0 1px; padding: 8px 16px; gap: 6px; backdrop-filter: none; }
    h1 { display: none; }
    #info { display: none; }
    button, input[type=number], select { padding: 6px 8px; }
  }
  .clegend { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 11px; color: var(--muted); }
  .clegend[hidden] { display: none; }
  .clegend .bar { flex: 1; height: 8px; border-radius: 4px; min-width: 80px; }
  .clegend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-left: 4px; }
  .val { text-align: right; color: var(--muted); font-size: 12px; }
  #schem { position: absolute; right: 12px; bottom: 12px; width: min(380px, calc(100% - 24px)); background: var(--panel); backdrop-filter: blur(8px);
    border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; display: grid; gap: 6px; z-index: 2; }
  #schem[hidden] { display: none; }
  #schem.min svg, #schem.min .legend, #schem.min .note { display: none; }
  .schemHead { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .schemHead button { padding: 0 8px; flex: 0; }
  #schemSvg { width: 100%; max-height: 46vh; display: block; }
  #schemSvg .shell { fill: none; stroke: var(--muted); stroke-width: 1px; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; opacity: .7; }
  #schemSvg .envelope { fill: none; stroke: var(--muted); stroke-width: 1.5px; vector-effect: non-scaling-stroke; }
  #schemSvg .core { fill: #e7c25a; fill-opacity: .35; stroke: #c9a23e; stroke-width: 1px; vector-effect: non-scaling-stroke; }
  #schemSvg .axis { stroke: var(--muted); stroke-width: 1px; stroke-dasharray: 1 4; vector-effect: non-scaling-stroke; }
  #schemSvg .scale line { stroke: var(--text); stroke-width: 2px; vector-effect: non-scaling-stroke; }
  #schemSvg .scale text { fill: var(--muted); }
  .legend { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
  #legendBar { flex: 1; height: 8px; border-radius: 4px; }
  .note { font-size: 11px; color: var(--muted); }
  @media (max-width: 700px) {
    #schem { right: 8px; bottom: 8px; width: calc(100% - 16px); padding: 6px 8px; }
    #schemSvg { max-height: 26dvh; }
    .note { display: none; }
  }
  button:disabled, input:disabled { opacity: .45; cursor: default; }
  #drop { position: fixed; inset: 0; display: none; place-items: center; background: rgba(178,69,108,.18); font-size: 18px; pointer-events: none; }
  body.dragging #drop { display: grid; }
</style>
</head>
<body>
<div id="app">
  <div id="schem" hidden>
    <div class="schemHead"><span id="schemTitle"></span><button id="schemMin" title="Hide or show the schematic">–</button></div>
    <svg id="schemSvg" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="legend"><span>inner</span><span id="legendBar"></span><span>outer</span></div>
    <div class="note">Dashed: layer shells. Line width is the petal's real thickness.</div>
  </div>
</div>
<div id="panel">
  <h1>AutoMarkBloom</h1>
  <div class="row"><label for="source">Flower</label><select id="source"><option value="core" hidden>Rust core (any seed)</option><option value="stub">Stub (any seed)</option><option value="samples/flower_11_0.amb.txt">Core, seed 11, bud to open</option><option value="samples/bud_11.json">Core bud, seed 11</option><option value="samples/bud_2027.json">Core bud, seed 2027</option></select></div>
  <div class="row" id="seedRow"><label for="seed">Seed</label><input id="seed" type="number" value="7" min="0" /><button id="reroll" title="Random seed">Random</button></div>
  <div class="row" id="flowerRow"><label for="flowerIdx" title="Sibling flowers on the same plant">Flower #</label><input id="flowerIdx" type="number" value="0" min="0" step="1" /><button id="sibling" title="Next sibling flower on this plant">Next sibling</button></div>
  <label id="fullRow" title="Off: fast preview packing. On: the full, canonical bud (much slower)."><input id="fullBud" type="checkbox" /> Full-quality bud (slower)</label>
  <div>
    <div class="row"><label>Opening</label><span id="frame" style="text-align:right;color:var(--muted);font-size:12px"></span></div>
    <input id="time" type="range" min="0" max="1" step="0.001" value="0" />
  </div>
  <div class="row"><button id="play" class="primary">Play</button><button id="prev">◀ Step</button><button id="next">Step ▶</button></div>
  <details id="views" open><summary>Bud views</summary><div class="more">
  <label><input id="plantParts" type="checkbox" checked /> Stem and sepals</label>
  <div class="row"><label for="colour">Colour</label><select id="colour"><option value="natural">Natural</option><option value="schematic">Schematic (translucent)</option></select></div>
  <div id="colourLegend" class="clegend" hidden></div>
  <div><div class="row"><label for="explode">Exploded</label><span class="val" id="explodeVal">off</span></div><input id="explode" type="range" min="0" max="3" step="0.01" value="0" /></div>
  <div><div class="row"><label for="peel">Layers shown</label><span class="val" id="peelVal"></span></div><input id="peel" type="range" min="1" max="1" step="1" value="1" /></div>
  <div class="row"><label for="section">Section</label><select id="section"><option value="off">Off</option><option value="vertical">Vertical, through the axis</option><option value="horizontal">Horizontal slice</option></select></div>
  <div id="sectionCtl" hidden>
    <div class="row"><label for="secPos" id="secPosLabel">Angle</label><span class="val" id="secPosVal"></span></div><input id="secPos" type="range" min="0" max="1" step="0.002" value="0.5" />
    <label><input id="clip" type="checkbox" checked /> Cut the 3D model too</label>
  </div>
  </div></details>
  <details id="more" open><summary>More options</summary><div class="more">
  <div class="row"><label for="speed">Speed</label><select id="speed"><option value="4">4 steps/s</option><option value="12" selected>12 steps/s</option><option value="24">24 steps/s</option></select></div>
  <label title="Curved interpolation between saved steps; off draws straight lines between them"><input id="smooth" type="checkbox" checked /> Smooth motion between steps</label>
  <div class="row"><label><input id="shells" type="checkbox" /> Shells</label><label><input id="wire" type="checkbox" /> Wireframe</label></div>
  <div class="row"><button id="glbStatic">Export pose .glb</button><button id="glbAnim">Export opening .glb</button></div>
  <div class="row"><button id="load">Load core JSON…</button><input id="file" type="file" accept=".json,.amb,.txt,.gz,application/json" hidden /></div>
  </div></details>
  <div id="info"></div>
  <div id="err"></div>
</div>
<div id="drop">Drop a flower JSON to view it</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
