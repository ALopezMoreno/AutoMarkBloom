<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="icon" href="data:," />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AutoMarkBloom Viewer</title>
<style>
  :root { --bg: #f6f1ec; --panel: rgba(255,255,255,0.86); --text: #2b2228; --muted: #7a6b72; --accent: #b2456c; --line: #e4d8dc; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #17131a; --panel: rgba(34,28,36,0.88); --text: #f1e8ec; --muted: #a8979f; --accent: #ef8fb0; --line: #3a2f3c; } }
  :root[data-theme="dark"] { --bg: #17131a; --panel: rgba(34,28,36,0.88); --text: #f1e8ec; --muted: #a8979f; --accent: #ef8fb0; --line: #3a2f3c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  #app { position: fixed; inset: 0; }
  #panel { position: fixed; top: 12px; left: 12px; width: min(300px, calc(100vw - 24px)); background: var(--panel); backdrop-filter: blur(8px);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 10px; }
  h1 { font-size: 15px; margin: 0; letter-spacing: .02em; }
  .row { display: flex; gap: 6px; align-items: center; }
  .row > * { flex: 1; }
  label { color: var(--muted); font-size: 12px; }
  input[type=number], button, select { font: inherit; color: var(--text); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: white; border-color: var(--accent); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  #info { color: var(--muted); font-size: 12px; }
  #err { color: #c0392b; font-size: 12px; white-space: pre-wrap; }
  #drop { position: fixed; inset: 0; display: none; place-items: center; background: rgba(178,69,108,.18); font-size: 18px; pointer-events: none; }
  body.dragging #drop { display: grid; }
</style>
</head>
<body>
<div id="app"></div>
<div id="panel">
  <h1>AutoMarkBloom</h1>
  <div class="row"><label for="seed">Seed</label><input id="seed" type="number" value="7" min="0" /><button id="reroll" title="Random seed">Random</button></div>
  <div>
    <div class="row"><label>Opening</label><span id="frame" style="text-align:right;color:var(--muted);font-size:12px"></span></div>
    <input id="time" type="range" min="0" max="1" step="0.001" value="0" />
  </div>
  <div class="row"><button id="play" class="primary">Play</button><button id="prev">◀ Step</button><button id="next">Step ▶</button></div>
  <div class="row"><label for="speed">Speed</label><select id="speed"><option value="4">4 steps/s</option><option value="12" selected>12 steps/s</option><option value="24">24 steps/s</option></select></div>
  <div class="row"><label><input id="shells" type="checkbox" /> Shells</label><label><input id="wire" type="checkbox" /> Wireframe</label></div>
  <div class="row"><button id="glbStatic">Export pose .glb</button><button id="glbAnim">Export opening .glb</button></div>
  <div class="row"><button id="load">Load core JSON…</button><input id="file" type="file" accept=".json,application/json" hidden /></div>
  <div id="info"></div>
  <div id="err"></div>
</div>
<div id="drop">Drop a flower JSON to view it</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
