name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --release
      - name: Clippy
        run: cargo clippy --release --workspace --all-targets
      - name: Seed digests
        shell: bash
        run: cargo run -q --release -p automark-checks --bin seed-digests > digests-${{ matrix.os }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.os }}
          path: digests-${{ matrix.os }}.txt

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Seed digests under WebAssembly
        run: |
          cargo build --release -p automark-checks --bin seed-digests --target wasm32-wasip1
          node --no-warnings scripts/run-wasi.mjs target/wasm32-wasip1/release/seed-digests.wasm > digests-wasm.txt
      - name: Browser package
        run: wasm-pack build wasm --release --target web
      - uses: actions/upload-artifact@v4
        with:
          name: digests-wasm
          path: digests-wasm.txt

  same-flower-everywhere:
    name: Same flower on every platform
    needs: [native, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          merge-multiple: true
      - name: Compare with golden digests
        run: |
          status=0
          for f in digests-*.txt; do
            if diff -u checks/golden/digests.txt "$f"; then
              echo "$f matches"
            else
              echo "::error::$f differs from checks/golden/digests.txt"
              status=1
            fi
          done
          exit $status

  viewer:
    name: Viewer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The viewer picks up wasm/pkg when present and grows buds live from it.
      - name: Browser package
        run: wasm-pack build wasm --release --target web
      - name: Build viewer
        working-directory: viewer
        run: |
          npm ci
          npm run build
          test -n "$(find dist -name '*.wasm')" || { echo "::error::viewer build is missing the core's wasm"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-site
          path: viewer/dist
