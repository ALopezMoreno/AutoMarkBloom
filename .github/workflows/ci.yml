name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --release
      - name: Clippy
        run: cargo clippy --release --workspace --all-targets

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      # Native builds are compared with the golden digests by the tests above.
      # WASI has no threads, so the seeds are split across one process per core.
      - name: Same flower as native, under WebAssembly
        run: |
          cargo build --release -p automark-checks --bin seed-digests --target wasm32-wasip1
          n=$(nproc)
          for k in $(seq 0 $((n - 1))); do
            node --no-warnings scripts/run-wasi.mjs target/wasm32-wasip1/release/seed-digests.wasm "$k/$n" > "shard-$k.txt" &
          done
          wait
          cat shard-*.txt | sort > digests-wasm.txt
          if ! diff -u <(sort checks/golden/digests.txt) digests-wasm.txt; then
            echo "::error::WebAssembly digests differ from checks/golden/digests.txt"
            exit 1
          fi
      - name: Browser package
        run: wasm-pack build wasm --release --target web

  viewer:
    name: Viewer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The viewer picks up wasm/pkg when present and grows buds live from it.
      - name: Browser package
        run: wasm-pack build wasm --release --target web
      - name: Build viewer
        working-directory: viewer
        run: |
          npm ci
          npm run build
          test -n "$(find dist -name '*.wasm')" || { echo "::error::viewer build is missing the core's wasm"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-site
          path: viewer/dist
