[package]
name = "automark-core"
version = "0.1.0"
edition = "2021"
description = "Automark Bloom: stochastic procedural flowers (bud formation, later flowering)"

[lib]
name = "automark_core"

[[bin]]
name = "automark"
path = "src/bin/automark.rs"

[dependencies]
libm = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
