[package]
name = "automark-checks"
version = "0.1.0"
edition.workspace = true
description = "Seed determinism checks: each seed must always give the same flower on every platform"
publish = false

[dependencies]
automark-core = { path = "../core" }
sha2 = { version = "0.10", default-features = false }

[[bin]]
name = "seed-digests"
path = "src/bin/seed-digests.rs"
